<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RugbyTactix - U13 Tactics Whiteboard & Animation Studio</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    /* Custom pitch and UI styling */
    .pitch-shadow {
      box-shadow: inset 0 0 120px rgba(0,0,0,0.45), 0 16px 40px -10px rgba(0,0,0,0.7);
    }

    /* Marquee selection box */
    #selectionBox {
      display: none;
      position: absolute;
      border: 1.5px dashed #38bdf8;
      background-color: rgba(56, 189, 248, 0.18);
      pointer-events: none;
      z-index: 45;
    }

    /* Custom scrollbars */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #0f172a;
    }
    ::-webkit-scrollbar-thumb {
      background: #334155;
      border-radius: 3px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #475569;
    }

    @keyframes frame-glow {
      0%, 100% { border-color: #ef4444; box-shadow: 0 0 8px rgba(239, 68, 68, 0.6); }
      50% { border-color: #f87171; box-shadow: 0 0 18px rgba(248, 113, 113, 0.9); }
    }
    .active-frame-card {
      animation: frame-glow 2s infinite ease-in-out;
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 flex flex-col h-screen overflow-hidden font-sans select-none">

  <!-- Top Navigation Header -->
  <header class="h-16 bg-slate-900 border-b border-slate-800 px-3 sm:px-5 flex items-center justify-between z-30 shrink-0 select-none shadow-lg">
    <div class="flex items-center space-x-3">
      <!-- Logo Branding (Cleaned up: No yellow badge, no subtitle description) -->
      <div class="flex items-center space-x-2">
        <div class="w-9 h-9 rounded-lg bg-red-600 flex items-center justify-center text-white shadow-md shadow-red-950/60 ring-1 ring-red-400/40">
          <i data-lucide="shield" class="w-5 h-5"></i>
        </div>
        <span class="font-black text-lg tracking-wider text-white flex items-center gap-1.5 leading-none">
          RUGBY<span class="text-red-500">TACTIX</span>
        </span>
        <!-- Hidden title anchor for JS title state -->
        <span id="playTitleDisplay" class="hidden">Custom Tactical Play</span>
      </div>

      <!-- Desktop Playbook Dropdown Section -->
      <div class="hidden xl:flex items-center ml-4 pl-4 border-l border-slate-800">
        <label class="text-xs text-slate-300 mr-2 flex items-center gap-1 font-semibold">
          <i data-lucide="book-open" class="w-3.5 h-3.5 text-emerald-400"></i> Playbook:
        </label>
        <select id="presetSelect" class="bg-slate-800 text-xs text-slate-100 font-medium border border-slate-700 rounded-lg px-2.5 py-1.5 focus:ring-2 focus:ring-emerald-500 focus:outline-none cursor-pointer max-w-[280px]">
          <option value="" disabled selected>Select Play...</option>
          <optgroup label="🌐 Team Plays (GitHub /plays)" id="githubPlaysGroup" class="hidden">
            <!-- Dynamically populated from /plays/manifest.json -->
          </optgroup>
          <optgroup label="⭐ My Saved Device Plays" id="localCustomGroup" class="hidden">
            <!-- Dynamically populated from localStorage -->
          </optgroup>
        </select>

        <!-- Reload/Sync Plays from GitHub Manifest -->
        <button id="btnSyncManifest" class="ml-1.5 p-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-300 hover:text-emerald-400 transition" title="Refresh Team Plays from GitHub (/plays/manifest.json)">
          <i data-lucide="refresh-cw" class="w-3.5 h-3.5"></i>
        </button>

        <!-- Quick Save to Browser Presets -->
        <button id="btnSaveToLocal" class="ml-2 px-2.5 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 border border-slate-700 text-amber-400 hover:text-amber-300 font-semibold text-xs flex items-center gap-1 transition" title="Save this play to your device dropdown">
          <i data-lucide="star" class="w-3.5 h-3.5"></i>
          <span>Save to Presets</span>
        </button>
      </div>
    </div>

    <!-- Pitch Camera Views & Primary Actions -->
    <div class="flex items-center space-x-2 sm:space-x-3">
      <!-- Camera View Angle Selector -->
      <div class="flex bg-slate-800 p-0.5 rounded-lg border border-slate-700 text-xs">
        <button id="viewFullPitch" class="px-2.5 py-1 rounded-md bg-emerald-600 text-white font-medium shadow transition" title="Full Pitch View">Full</button>
        <button id="viewHalfPitch" class="px-2.5 py-1 rounded-md text-slate-300 hover:text-white font-medium transition" title="Half Pitch View">Half</button>
        <button id="view22Pitch" class="px-2.5 py-1 rounded-md text-slate-300 hover:text-white font-medium transition" title="22m Red Zone View">22m</button>
      </div>

      <!-- Load JSON Modal Trigger -->
      <button id="btnOpenLoadModal" class="px-3 py-1.5 rounded-lg bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-500 hover:to-teal-500 text-white font-bold text-xs flex items-center gap-1.5 shadow-md shadow-emerald-950/60 ring-1 ring-emerald-400/50 transition active:scale-95">
        <i data-lucide="folder-open" class="w-3.5 h-3.5"></i>
        <span>LOAD JSON</span>
      </button>

      <!-- Save / Export JSON Download -->
      <button id="btnExportJSON" class="px-3 py-1.5 rounded-lg bg-amber-500 hover:bg-amber-400 text-slate-950 font-extrabold text-xs flex items-center gap-1.5 shadow-md shadow-amber-950/60 ring-1 ring-amber-300/60 transition active:scale-95" title="Export this play as a downloadable JSON file">
        <i data-lucide="download" class="w-3.5 h-3.5"></i>
        <span>SAVE JSON</span>
      </button>

      <!-- Snapshot PNG Image -->
      <button id="btnExportImage" class="p-2 rounded-lg bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-300 hover:text-white transition" title="Export Current Pitch as PNG">
        <i data-lucide="camera" class="w-4 h-4"></i>
      </button>

      <!-- Clear Pitch -->
      <button id="btnClearPitch" class="p-2 rounded-lg bg-slate-800 hover:bg-red-950/60 border border-slate-700 hover:border-red-600/60 text-slate-300 hover:text-red-400 transition" title="Clear all players & drawings">
        <i data-lucide="trash-2" class="w-4 h-4"></i>
      </button>
    </div>
  </header>

  <!-- Mobile Sub-Header for Playbook Selection -->
  <div class="bg-slate-900/90 border-b border-slate-800 px-3 sm:px-5 py-1.5 flex items-center justify-between text-xs xl:hidden z-20">
    <div class="flex items-center gap-2">
      <span class="text-slate-400 font-semibold flex items-center gap-1">
        <i data-lucide="bookmark" class="w-3.5 h-3.5 text-emerald-400"></i> Play:
      </span>
      <select id="presetSelectMobile" class="bg-slate-800 text-slate-200 text-xs rounded border border-slate-700 px-2 py-0.5 max-w-[190px] sm:max-w-xs">
        <option value="" disabled selected>Select Play...</option>
        <optgroup label="🌐 Team Plays (GitHub)" id="githubPlaysGroupMobile" class="hidden"></optgroup>
        <optgroup label="⭐ My Saved Plays" id="localCustomGroupMobile" class="hidden"></optgroup>
      </select>
    </div>
    <div class="flex items-center gap-1.5">
      <button id="btnSyncManifestMobile" class="p-1 rounded bg-slate-800 border border-slate-700 text-slate-300" title="Sync Plays">
        <i data-lucide="refresh-cw" class="w-3 h-3"></i>
      </button>
      <button id="btnSaveToLocalMobile" class="px-2 py-0.5 rounded bg-slate-800 border border-slate-700 text-amber-400 font-medium text-[11px]" title="Save Play">
        Save
      </button>
    </div>
  </div>

  <!-- Workspace: Sidebar + Pitch Stage -->
  <div class="flex-1 flex overflow-hidden relative">

    <!-- Left Sidebar: U13 Roster & Formations Deployment -->
    <aside id="rosterSidebar" class="w-64 bg-slate-900 border-r border-slate-800 flex flex-col z-20 transition-all duration-300 shrink-0 select-none relative shadow-xl">
      <!-- Team Selector Tabs: Red (Attack) vs Gold (Defense) -->
      <div class="flex border-b border-slate-800 bg-slate-950/60 p-1.5 gap-1.5">
        <button id="tabTeamA" class="flex-1 py-1.5 px-2 rounded-lg font-bold text-xs flex items-center justify-center gap-1.5 bg-red-600 text-white shadow-md shadow-red-950/60 border border-red-500/40 transition">
          <span class="w-2.5 h-2.5 rounded-full bg-white ring-1 ring-black"></span>
          <span>Red (Attack)</span>
        </button>
        <button id="tabTeamB" class="flex-1 py-1.5 px-2 rounded-lg font-bold text-xs flex items-center justify-center gap-1.5 text-slate-400 hover:text-amber-400 hover:bg-slate-800/80 transition">
          <span class="w-2.5 h-2.5 rounded-full bg-amber-400 ring-1 ring-black"></span>
          <span>Gold (Def)</span>
        </button>
      </div>

      <!-- Quick U13 Dual-Team Formation Presets (Labels without numbers in brackets) -->
      <div class="px-3 py-2 border-b border-slate-800 bg-slate-900/50 flex flex-col gap-1.5 text-xs">
        <div class="flex items-center justify-between text-slate-400 font-semibold text-[11px] tracking-wide uppercase">
          <span>Deploy U13 Formations</span>
        </div>
        <div class="grid grid-cols-3 gap-1">
          <button id="btnDeployFreePass" class="px-2 py-1.5 bg-slate-800 hover:bg-slate-700 text-xs font-bold rounded text-slate-200 hover:text-white border border-slate-700/80 transition truncate text-center" title="Deploy Free Pass (13v13: 10m from touch, 1 blind defender & deep open attack)">
            Free Pass
          </button>
          <button id="btnDeployScrum" class="px-2 py-1.5 bg-slate-800 hover:bg-slate-700 text-xs font-bold rounded text-slate-200 hover:text-white border border-slate-700/80 transition truncate text-center" title="Deploy 6-Man Scrum (13v13: 1/3 across pitch North-to-South)">
            Scrum
          </button>
          <button id="btnDeployPenalty" class="px-2 py-1.5 bg-slate-800 hover:bg-slate-700 text-xs font-bold rounded text-slate-200 hover:text-white border border-slate-700/80 transition truncate text-center" title="Deploy Penalty (13v13: 10m Offside Defense & V-Formation Attack)">
            Penalty
          </button>
        </div>
      </div>

      <!-- Ball & Markers Deployment Strip -->
      <div class="px-3 py-2 border-b border-slate-800 bg-slate-950/40 flex items-center justify-between">
        <button id="btnAddBall" class="flex-1 mr-2 px-2.5 py-1.5 rounded-lg bg-amber-500/20 hover:bg-amber-500/30 border border-amber-500/40 text-amber-300 font-bold text-xs flex items-center justify-center gap-1.5 transition">
          <span class="w-3.5 h-2.5 rounded-full bg-amber-200 border border-slate-900 inline-block -rotate-12"></span>
          <span>Add Rugby Ball</span>
        </button>
        <button id="btnAddCone" class="px-2.5 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 border border-slate-700 text-orange-400 font-semibold text-xs flex items-center gap-1 transition" title="Add Training Cone">
          <span>▲</span>
          <span>Cone</span>
        </button>
      </div>

      <!-- Roster Player Token List -->
      <div class="flex-1 overflow-y-auto p-3 space-y-1.5" id="rosterListContainer">
        <!-- Rendered via JS -->
      </div>

      <!-- Collapse Sidebar Toggle Button (Floats cleanly outside sidebar, updates icon on toggle) -->
      <button id="btnToggleSidebar" class="absolute -right-7 top-16 bg-slate-800 hover:bg-slate-700 border-2 border-slate-700 text-slate-200 w-7 h-7 rounded-full flex items-center justify-center shadow-2xl z-50 transition cursor-pointer" title="Toggle Sidebar">
        <i data-lucide="chevron-left" id="sidebarCollapseIcon" class="w-4 h-4"></i>
      </button>
    </aside>

    <!-- Pitch Stage & Animation Board -->
    <main class="flex-1 flex flex-col h-full overflow-hidden bg-slate-950 relative">

      <!-- Floating Annotation Toolbar -->
      <div class="absolute top-3 left-1/2 -translate-x-1/2 z-30 bg-slate-900/90 backdrop-blur-md border border-slate-700/80 rounded-xl px-2.5 py-1.5 flex items-center space-x-1.5 shadow-2xl">
        <button id="toolSelect" class="p-1.5 rounded-lg bg-red-600 text-white font-semibold flex items-center gap-1 text-xs transition" title="Select / Move Players (V) [Click-drag marquee box for multi-select]">
          <i data-lucide="mouse-pointer-2" class="w-4 h-4"></i>
        </button>

        <div class="h-4 w-px bg-slate-700 mx-0.5"></div>

        <button id="toolRun" class="p-1.5 rounded-lg text-slate-400 hover:text-white hover:bg-slate-800 transition" title="Player Run Arrow (R)">
          <i data-lucide="arrow-right" class="w-4 h-4 text-emerald-400"></i>
        </button>
        <button id="toolPass" class="p-1.5 rounded-lg text-slate-400 hover:text-white hover:bg-slate-800 transition" title="Pass Trajectory (P)">
          <i data-lucide="move-right" class="w-4 h-4 text-sky-400 stroke-dashed"></i>
        </button>
        <button id="toolKick" class="p-1.5 rounded-lg text-slate-400 hover:text-white hover:bg-slate-800 transition" title="Kick Trajectory (K)">
          <i data-lucide="trending-up" class="w-4 h-4 text-yellow-400"></i>
        </button>
        <button id="toolTackle" class="p-1.5 rounded-lg text-slate-400 hover:text-white hover:bg-slate-800 transition" title="Tackle Line (T)">
          <i data-lucide="shield-alert" class="w-4 h-4 text-red-400"></i>
        </button>

        <div class="h-4 w-px bg-slate-700 mx-0.5"></div>

        <!-- Annotation Palette -->
        <div class="flex items-center space-x-1 pl-1">
          <button class="w-4 h-4 rounded-full bg-yellow-400 ring-2 ring-white/80 color-swatch" data-color="#facc15"></button>
          <button class="w-4 h-4 rounded-full bg-white ring-1 ring-slate-600 color-swatch" data-color="#ffffff"></button>
          <button class="w-4 h-4 rounded-full bg-red-500 ring-1 ring-slate-600 color-swatch" data-color="#ef4444"></button>
          <button class="w-4 h-4 rounded-full bg-sky-400 ring-1 ring-slate-600 color-swatch" data-color="#38bdf8"></button>
        </div>

        <div class="h-4 w-px bg-slate-700 mx-0.5"></div>

        <button id="btnClearDrawings" class="p-1.5 rounded-lg text-slate-400 hover:text-amber-400 hover:bg-slate-800 transition" title="Clear current drawings">
          <i data-lucide="eraser" class="w-4 h-4"></i>
        </button>
      </div>

      <!-- Player Inspector Overlay -->
      <div id="inspectorPanel" class="hidden absolute top-16 right-4 z-30 bg-slate-900/95 backdrop-blur-md border border-slate-700 rounded-xl p-3 shadow-2xl flex flex-col gap-2 min-w-[210px]">
        <div class="flex items-center justify-between border-b border-slate-800 pb-1.5">
          <span class="text-xs font-bold text-slate-200">Player Inspector</span>
          <button id="btnCloseInspector" class="text-slate-400 hover:text-white text-xs font-bold">✕</button>
        </div>
        <div class="flex items-center gap-2">
          <label class="text-[11px] text-slate-400 w-12">Number:</label>
          <input type="text" id="inspectorLabel" class="w-16 bg-slate-800 border border-slate-700 rounded px-2 py-0.5 text-xs text-white font-bold" />
        </div>
        <div class="flex items-center gap-2">
          <label class="text-[11px] text-slate-400 w-12">Name:</label>
          <input type="text" id="inspectorName" class="flex-1 bg-slate-800 border border-slate-700 rounded px-2 py-0.5 text-xs text-white" />
        </div>
        <div class="flex items-center gap-2 pt-1">
          <button id="btnAttachBall" class="flex-1 py-1 rounded bg-amber-500/20 hover:bg-amber-500/30 border border-amber-500/40 text-amber-300 font-semibold text-xs flex items-center justify-center gap-1">
            <i data-lucide="paperclip" class="w-3 h-3"></i> Make Carrier
          </button>
          <button id="btnDeleteSelectedActor" class="p-1 rounded bg-red-600/20 hover:bg-red-600/30 border border-red-500/40 text-red-400 hover:text-red-300 text-xs" title="Remove Player">
            <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
          </button>
        </div>
      </div>

      <!-- Pitch Wrapper: Constrained properly to fit inside viewport without clipping -->
      <div id="pitchWrapper" class="flex-1 w-full h-full p-2 sm:p-4 flex items-center justify-center relative select-none overflow-hidden">

        <!-- Selection marquee rectangle -->
        <div id="selectionBox"></div>

        <!-- Drag-Off Trash Drop Bin Indicator -->
        <div id="dragTrashZone" class="absolute bottom-6 right-8 bg-red-950/80 border-2 border-dashed border-red-500 rounded-xl px-4 py-3 flex items-center gap-2 text-red-200 z-30 opacity-0 pointer-events-none transition-all duration-200 shadow-2xl">
          <i data-lucide="trash-2" class="w-5 h-5 text-red-400 animate-bounce"></i>
          <span class="text-xs font-bold uppercase tracking-wider">Drag here to remove</span>
        </div>

        <!-- Pitch Board Holder: Scaled to fit perfectly in viewport -->
        <div id="pitchBoard" class="relative rounded-2xl overflow-hidden pitch-shadow border-4 border-emerald-950 transition-all duration-300 max-w-full max-h-full" style="aspect-ratio: 100 / 60; width: 100%; max-width: 1100px;">

          <!-- Vector Pitch Lines (Rugby Union 1000 x 600 coordinate grid) -->
          <svg id="pitchSvg" class="w-full h-full block bg-emerald-600" viewBox="0 0 1000 600" preserveAspectRatio="xMidYMid meet">
            <defs>
              <!-- Traditional Vibrant Grass Striping Pattern -->
              <pattern id="grassStripes" width="80" height="600" patternUnits="userSpaceOnUse">
                <rect width="40" height="600" fill="#15803d" />
                <rect x="40" width="40" height="600" fill="#16a34a" />
              </pattern>
              <!-- Drawing Arrowhead Markers -->
              <marker id="arrow-run" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                <path d="M 0 1 L 10 5 L 0 9 z" fill="#facc15" />
              </marker>
              <marker id="arrow-pass" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8" />
              </marker>
              <marker id="arrow-kick" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                <path d="M 0 1 L 10 5 L 0 9 z" fill="#facc15" />
              </marker>
            </defs>

            <!-- Grass surface -->
            <rect width="1000" height="600" fill="url(#grassStripes)" />

            <!-- Pitch Markings (White, 2.5px stroke) -->
            <!-- Perimeter Boundary -->
            <rect x="10" y="20" width="980" height="560" fill="none" stroke="#ffffff" stroke-width="2.5" />

            <!-- Dead Ball Lines (x=20 and x=980) & Touchlines (y=30 and y=570) -->
            <rect x="20" y="30" width="960" height="540" fill="none" stroke="#ffffff" stroke-width="2.5" />

            <!-- In-Goal Zones Shading -->
            <rect x="20" y="30" width="80" height="540" fill="rgba(0,0,0,0.08)" />
            <rect x="900" y="30" width="80" height="540" fill="rgba(0,0,0,0.08)" />

            <!-- Try Lines (Goal Lines at x=100 and x=900) -->
            <line x1="100" y1="30" x2="100" y2="570" stroke="#ffffff" stroke-width="3.5" />
            <line x1="900" y1="30" x2="900" y2="570" stroke="#ffffff" stroke-width="3.5" />

            <!-- 22m Lines (Solid at x=276 and x=724) -->
            <line x1="276" y1="30" x2="276" y2="570" stroke="#ffffff" stroke-width="2.5" />
            <line x1="724" y1="30" x2="724" y2="570" stroke="#ffffff" stroke-width="2.5" />

            <!-- 10m Dashed Lines (Dashed at x=420 and x=580) -->
            <line x1="420" y1="30" x2="420" y2="570" stroke="#ffffff" stroke-width="2" stroke-dasharray="8 8" />
            <line x1="580" y1="30" x2="580" y2="570" stroke="#ffffff" stroke-width="2" stroke-dasharray="8 8" />

            <!-- Halfway Line (Solid at x=500) -->
            <line x1="500" y1="30" x2="500" y2="570" stroke="#ffffff" stroke-width="3" />
            <circle cx="500" cy="300" r="4" fill="#ffffff" />

            <!-- 5m and 15m Dashed Touchlines and Scrum Markings -->
            <!-- 5m from touch (y=70 and y=530) -->
            <line x1="100" y1="70" x2="900" y2="70" stroke="#ffffff" stroke-width="1.5" stroke-dasharray="5 7" stroke-opacity="0.75" />
            <line x1="100" y1="530" x2="900" y2="530" stroke="#ffffff" stroke-width="1.5" stroke-dasharray="5 7" stroke-opacity="0.75" />

            <!-- 15m from touch (y=150 and y=450) -->
            <line x1="100" y1="150" x2="900" y2="150" stroke="#ffffff" stroke-width="1.5" stroke-dasharray="5 7" stroke-opacity="0.75" />
            <line x1="100" y1="450" x2="900" y2="450" stroke="#ffffff" stroke-width="1.5" stroke-dasharray="5 7" stroke-opacity="0.75" />

            <!-- 5m from Try Line Dashed Marks -->
            <line x1="140" y1="65" x2="140" y2="535" stroke="#ffffff" stroke-width="1.5" stroke-dasharray="5 7" stroke-opacity="0.6" />
            <line x1="860" y1="65" x2="860" y2="535" stroke="#ffffff" stroke-width="1.5" stroke-dasharray="5 7" stroke-opacity="0.6" />

            <!-- H-Shaped Rugby Goal Posts -->
            <!-- Left Try-line Posts -->
            <circle cx="100" cy="272" r="5" fill="#f8fafc" stroke="#0f172a" stroke-width="1.5" />
            <circle cx="100" cy="328" r="5" fill="#f8fafc" stroke="#0f172a" stroke-width="1.5" />
            <line x1="100" y1="272" x2="100" y2="328" stroke="#f8fafc" stroke-width="2" />
            <!-- Right Try-line Posts -->
            <circle cx="900" cy="272" r="5" fill="#f8fafc" stroke="#0f172a" stroke-width="1.5" />
            <circle cx="900" cy="328" r="5" fill="#f8fafc" stroke="#0f172a" stroke-width="1.5" />
            <line x1="900" y1="272" x2="900" y2="328" stroke="#f8fafc" stroke-width="2" />

            <!-- SVG Ghost Motion Trails Layer -->
            <g id="ghostTrailsLayer" opacity="0.6"></g>

            <!-- SVG Tactical Drawings Layer -->
            <g id="drawingsLayer"></g>

            <!-- Active In-progress Drawing Path -->
            <path id="activeDrawingPath" fill="none" stroke="#facc15" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
          </svg>

          <!-- Interactive Players Layer -->
          <div id="actorsContainer" class="absolute inset-0 pointer-events-none z-10"></div>

          <!-- TOP BALL LAYER (Strictly ensures ball is always on top of players and markings) -->
          <div id="ballTopLayer" class="absolute inset-0 pointer-events-none z-30"></div>
        </div>
      </div>

      <!-- Bottom Frame Timeline & Animation Bar (Enhanced height & visibility) -->
      <footer class="h-36 sm:h-40 bg-slate-900 border-t border-slate-800 flex flex-col z-30 shrink-0 select-none shadow-2xl">
        <!-- Timeline Controls Header Strip -->
        <div class="h-10 px-3 sm:px-6 bg-slate-900/90 border-b border-slate-800 flex items-center justify-between shrink-0">
          <div class="flex items-center space-x-2">

  <!-- Load JSON Modal Dialog -->
  <div id="loadModal" class="hidden fixed inset-0 z-50 flex items-center justify-center bg-black/75 backdrop-blur-sm p-4">

      <div class="flex items-center justify-between border-b border-slate-800 pb-3">

          <i data-lucide="folder-open" class="w-5 h-5 text-emerald-400"></i> Load Tactical Playbook JSON
        </h3>
        <button id="btnCloseLoadModal" class="text-slate-400 hover:text-white font-bold text-lg">✕</button>

      <!-- File upload drop area -->
      <div id="dropZone" class="border-2 border-dashed border-slate-700 hover:border-emerald-500 rounded-xl p-6 text-center cursor-pointer transition flex flex-col items-center justify-center bg-slate-950/50">

        <p class="text-xs text-slate-400 mt-1">or click to browse your files</p>
        <input type="file" id="fileInput" accept=".json" class="hidden" />

      <div class="relative flex py-1 items-center">
        <div class="flex-grow border-t border-slate-800"></div>
        <span class="flex-shrink mx-3 text-xs text-slate-500 uppercase tracking-widest font-bold">OR PASTE RAW JSON</span>
        <div class="flex-grow border-t border-slate-800"></div>
      </div>

      <textarea id="rawJsonInput" rows="4" class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2.5 text-xs font-mono text-slate-200 placeholder-slate-600 focus:outline-none focus:border-emerald-500" placeholder="Paste play JSON code directly..."></textarea>

      <div class="flex justify-end gap-2 pt-2">
        <button id="btnCancelLoad" class="px-4 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs font-semibold">Cancel</button>
        <button id="btnConfirmLoad" class="px-4 py-1.5 rounded-lg bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-bold shadow-lg">Load Play</button>

  <!-- Toast Notification Pill -->
  <div id="toast" class="fixed bottom-20 left-1/2 -translate-x-1/2 z-50 bg-slate-900 border border-slate-700 text-white text-xs font-medium px-4 py-2 rounded-full shadow-2xl transition-all duration-300 opacity-0 translate-y-20 pointer-events-none flex items-center gap-2">
    <i data-lucide="info" class="w-4 h-4 text-emerald-400"></i>
    <span id="toastMsg">Ready</span>
  </div>

  <script>
    // U13 Rugby Union Positional Template (13-a-side: Flankers 6 & 7 excluded)
    const RUGBY_POSITIONS = [
      { num: 1, name: 'Loosehead Prop', short: '1', role: 'prop', team: 'A' },
      { num: 2, name: 'Hooker', short: '2', role: 'hooker', team: 'A' },
      { num: 3, name: 'Tighthead Prop', short: '3', role: 'prop', team: 'A' },
      { num: 4, name: 'Lock (Second Row)', short: '4', role: 'lock', team: 'A' },
      { num: 5, name: 'Lock (Second Row)', short: '5', role: 'lock', team: 'A' },
      { num: 8, name: 'Number Eight', short: '8', role: 'number8', team: 'A' },
      { num: 9, name: 'Scrum Half', short: '9', role: 'scrumhalf', team: 'A' },
      { num: 10, name: 'Fly Half', short: '10', role: 'flyhalf', team: 'A' },
      { num: 11, name: 'Left Wing', short: '11', role: 'wing', team: 'A' },
      { num: 12, name: 'Inside Centre', short: '12', role: 'centre', team: 'A' },
      { num: 13, name: 'Outside Centre', short: '13', role: 'centre', team: 'A' },
      { num: 14, name: 'Right Wing', short: '14', role: 'wing', team: 'A' },
      { num: 15, name: 'Fullback', short: '15', role: 'fullback', team: 'A' }
    ];

    // Core Tactical Application State
    const state = {
      activeRosterTeam: 'A', // 'A' (Attack Red) or 'B' (Defense Gold)
      currentTool: 'select',
      currentColor: '#facc15',
      pitchView: 'full',
      selectedActorId: null,
      selectedActorIds: new Set(),
      githubManifestPlays: [],

      frames: [
        {
          id: 1,
          name: 'Phase 1 - Initial Set',
          actors: [],
          drawings: []
        }
      ],
      currentFrameIndex: 0,
      
      isPlaying: false,
      playbackSpeed: 1.0,
      loop: true,
      animationProgress: 0,
      animFrameReq: null,
      lastTimestamp: 0,
      frameDurationMs: 1400
    };

    // DOM Elements Cache
    const pitchSvg = document.getElementById('pitchSvg');
    const pitchBoard = document.getElementById('pitchBoard');
    const pitchWrapper = document.getElementById('pitchWrapper');
    const selectionBox = document.getElementById('selectionBox');
    const actorsContainer = document.getElementById('actorsContainer');
    const ballTopLayer = document.getElementById('ballTopLayer');
    const ghostTrailsLayer = document.getElementById('ghostTrailsLayer');
    const drawingsLayer = document.getElementById('drawingsLayer');
    const activeDrawingPath = document.getElementById('activeDrawingPath');
    const keyframeTimelineTrack = document.getElementById('keyframeTimelineTrack');
    const frameStatusText = document.getElementById('frameStatusText');
    const btnPlayPause = document.getElementById('btnPlayPause');
    const playIcon = document.getElementById('playIcon');
    const inspectorPanel = document.getElementById('inspectorPanel');
    const inspectorLabel = document.getElementById('inspectorLabel');
    const inspectorName = document.getElementById('inspectorName');
    const btnAttachBall = document.getElementById('btnAttachBall');
    const toast = document.getElementById('toast');
    const toastMsg = document.getElementById('toastMsg');
    const dragTrashZone = document.getElementById('dragTrashZone');

    // Drawing & Interaction State
    let isDrawing = false;
    let drawingStartPt = null;
    let currentFreehandPoints = [];

    let draggedActorId = null;
    let isDragging = false;
    let initialDragCoords = null;
    let initialActorPositions = new Map();

    // Area selection marquee state
    let isMarqueeSelecting = false;
    let marqueeStartClient = { x: 0, y: 0 };

    // Coordinate Conversion Functions
    function getPitchCoords(e) {
      const rect = pitchSvg.getBoundingClientRect();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      
      const rawX = ((clientX - rect.left) / rect.width) * 1000;
      const rawY = ((clientY - rect.top) / rect.height) * 600;

      const viewBox = pitchSvg.viewBox.baseVal;
      const normX = viewBox.x + (rawX * (viewBox.width / 1000));
      const normY = viewBox.y + (rawY * (viewBox.height / 600));

      return {
        x: Math.max(0, Math.min(1000, Math.round(normX))),
        y: Math.max(0, Math.min(600, Math.round(normY)))
      };
    }

    function pitchToPercent(x, y) {
      const viewBox = pitchSvg.viewBox.baseVal;
      const pX = ((x - viewBox.x) / viewBox.width) * 100;
      const pY = ((y - viewBox.y) / viewBox.height) * 100;
      return { pX, pY };
    }

    // Render Players & Ball onto Pitch
    function renderActors(interpolatedActors = null) {
      actorsContainer.innerHTML = '';
      ballTopLayer.innerHTML = '';

      const currentFrame = state.frames[state.currentFrameIndex];
      const actorsToRender = interpolatedActors || (currentFrame ? currentFrame.actors : []);

      actorsToRender.forEach(actor => {
        if (actor.type === 'ball') return;

        const coords = pitchToPercent(actor.x, actor.y);
        const el = document.createElement('div');
        el.className = 'absolute -translate-x-1/2 -translate-y-1/2 pointer-events-auto cursor-grab active:cursor-grabbing transition-transform select-none';
        el.style.left = `${coords.pX}%`;
        el.style.top = `${coords.pY}%`;
        el.dataset.id = actor.id;

        if (actor.type === 'player') {
          const isSelected = state.selectedActorIds.has(actor.id) || state.selectedActorId === actor.id;
          const isAttack = actor.team === 'A';
          
          // Enhanced luminance contrast for Red vs Gold (Accessible for Red/Green color-blindness)
          const teamColorClass = isAttack 
            ? 'bg-red-600 border-2 border-white text-white shadow-red-950/80 ring-2 ring-black/70' 
            : 'bg-amber-500 border-2 border-slate-950 text-slate-950 font-black shadow-amber-950/60 ring-2 ring-black/40';

          el.innerHTML = `
            <div class="relative group">
              ${isSelected ? '<div class="absolute -inset-2 rounded-full border-2 border-emerald-400 bg-emerald-400/20 animate-pulse pointer-events-none"></div>' : ''}
              ${actor.carrier ? '<div class="absolute -inset-2.5 rounded-full border-2 border-dashed border-yellow-300 animate-spin" style="animation-duration: 5s;"></div>' : ''}

              <div class="w-8 h-8 sm:w-9 sm:h-9 rounded-full ${teamColorClass} flex items-center justify-center font-bold text-xs sm:text-sm shadow-xl transform transition group-hover:scale-110">
                ${actor.num}
              </div>

              <div class="absolute -bottom-4 left-1/2 -translate-x-1/2 whitespace-nowrap px-1.5 py-0.2 rounded bg-slate-950/90 border border-slate-700/80 text-[9px] font-semibold text-slate-200 pointer-events-none">
                ${(actor.name || '').split(' ')[0]}
              </div>

              <button class="player-quick-del-btn absolute -top-2 -right-2 w-4 h-4 bg-red-600 hover:bg-red-500 text-white rounded-full flex items-center justify-center text-[10px] font-bold shadow opacity-0 group-hover:opacity-100 transition" title="Delete Player">
                ×
              </button>
            </div>
          `;

          const delBtn = el.querySelector('.player-quick-del-btn');
          if (delBtn) {
            delBtn.onmousedown = (e) => {
              e.stopPropagation();
              removePlayerById(actor.id);
            };
          }

        } else if (actor.type === 'cone') {
          el.innerHTML = `
            <div class="w-4 h-4 text-orange-500 drop-shadow-md flex items-center justify-center font-bold text-sm">
              ▲
            </div>
          `;
        }

        el.onmousedown = (e) => handleActorDragStart(e, actor.id);
        el.ontouchstart = (e) => handleActorDragStart(e, actor.id);

        actorsContainer.appendChild(el);
      });

      // Render Rugby Ball ALWAYS on top in dedicated ballTopLayer
      const ballActor = actorsToRender.find(a => a.type === 'ball');
      if (ballActor) {
        const coords = pitchToPercent(ballActor.x, ballActor.y);
        const ballEl = document.createElement('div');
        ballEl.className = 'absolute -translate-x-1/2 -translate-y-1/2 pointer-events-auto cursor-grab active:cursor-grabbing select-none z-30';
        ballEl.style.left = `${coords.pX}%`;
        ballEl.style.top = `${coords.pY}%`;
        ballEl.dataset.id = ballActor.id;

        const isSelected = state.selectedActorIds.has(ballActor.id) || state.selectedActorId === ballActor.id;

        ballEl.innerHTML = `
          <div class="relative group cursor-grab">
            ${isSelected ? '<div class="absolute -inset-2 rounded-full border-2 border-yellow-300 animate-pulse"></div>' : ''}
            <div class="w-8 h-5 sm:w-9 sm:h-5 bg-gradient-to-r from-amber-50 via-white to-amber-100 rounded-full border-2 border-amber-950 flex items-center justify-center shadow-2xl transform -rotate-12 transition group-hover:scale-125 ring-2 ring-black/50">
              <div class="w-full h-0.5 bg-red-600 relative">
                <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 flex space-x-0.5">
                  <span class="w-0.5 h-2 bg-slate-900"></span>
                  <span class="w-0.5 h-2 bg-slate-900"></span>
                  <span class="w-0.5 h-2 bg-slate-900"></span>
                </div>
              </div>
            </div>
            <div class="absolute -top-3.5 left-1/2 -translate-x-1/2 text-[8px] font-extrabold text-amber-300 bg-slate-950/90 px-1 py-0.2 rounded border border-amber-500/40 uppercase tracking-tighter shadow">BALL</div>
          </div>
        `;

        ballEl.onmousedown = (e) => handleActorDragStart(e, ballActor.id);
        ballEl.ontouchstart = (e) => handleActorDragStart(e, ballActor.id);

        ballTopLayer.appendChild(ballEl);
      }
    }

    // Actor Dragging & Multi-Selection Drag
    function handleActorDragStart(e, actorId) {
      if (state.isPlaying) return;
      if (state.currentTool !== 'select') return;
      e.stopPropagation();

      // Check for Shift key multi-selection toggle
      if (e.shiftKey) {
        if (state.selectedActorIds.has(actorId)) {
          state.selectedActorIds.delete(actorId);
          if (state.selectedActorId === actorId) {
            state.selectedActorId = state.selectedActorIds.size > 0 ? Array.from(state.selectedActorIds)[0] : null;
          }
        } else {
          state.selectedActorIds.add(actorId);
          state.selectedActorId = actorId;
        }
        renderActors();
        return;
      }

      // If clicked actor is not already in selected group, make it the single selection
      if (!state.selectedActorIds.has(actorId)) {
        state.selectedActorIds.clear();
        state.selectedActorIds.add(actorId);
        selectActor(actorId);
      }

      draggedActorId = actorId;
      isDragging = true;

      const currentFrame = state.frames[state.currentFrameIndex];
      const startPt = getPitchCoords(e);
      initialDragCoords = startPt;

      // Store initial positions of all currently selected actors for synchronized group move
      initialActorPositions.clear();
      state.selectedActorIds.forEach(id => {
        const a = currentFrame.actors.find(act => act.id === id);
        if (a) initialActorPositions.set(id, { x: a.x, y: a.y });
      });

      dragTrashZone.classList.remove('opacity-0', 'pointer-events-none');
      dragTrashZone.classList.add('opacity-100');

      window.addEventListener('mousemove', handleActorDragMove);
      window.addEventListener('touchmove', handleActorDragMove, { passive: false });
      window.addEventListener('mouseup', handleActorDragEnd);
      window.addEventListener('touchend', handleActorDragEnd);
    }

    function handleActorDragMove(e) {
      if (!isDragging || !draggedActorId || !initialDragCoords) return;
      if (e.cancelable && e.type === 'touchmove') e.preventDefault();

      const currentFrame = state.frames[state.currentFrameIndex];
      const currentCoords = getPitchCoords(e);
      const deltaX = currentCoords.x - initialDragCoords.x;
      const deltaY = currentCoords.y - initialDragCoords.y;

      // Move all selected actors together
      initialActorPositions.forEach((initPos, id) => {
        const actor = currentFrame.actors.find(a => a.id === id);
        if (actor) {
          actor.x = Math.max(10, Math.min(990, initPos.x + deltaX));
          actor.y = Math.max(10, Math.min(590, initPos.y + deltaY));

          if (actor.carrier) {
            const ball = currentFrame.actors.find(a => a.type === 'ball');
            if (ball) {
              ball.x = actor.x + 9;
              ball.y = actor.y + 9;
            }
          }
        }
      });

      renderActors();
      renderGhostTrails();
    }

    function handleActorDragEnd(e) {
      if (!isDragging) return;
      isDragging = false;

      const trashRect = dragTrashZone.getBoundingClientRect();
      const clientX = e.changedTouches ? e.changedTouches[0].clientX : e.clientX;
      const clientY = e.changedTouches ? e.changedTouches[0].clientY : e.clientY;

      if (
        clientX >= trashRect.left &&
        clientX <= trashRect.right &&
        clientY >= trashRect.top &&
        clientY <= trashRect.bottom
      ) {
        // Remove all selected actors if dropped on trash
        const idsToRemove = Array.from(state.selectedActorIds);
        idsToRemove.forEach(id => removePlayerById(id));
        state.selectedActorIds.clear();
      }

      dragTrashZone.classList.remove('opacity-100');
      dragTrashZone.classList.add('opacity-0', 'pointer-events-none');

      draggedActorId = null;
      initialDragCoords = null;
      initialActorPositions.clear();

      window.removeEventListener('mousemove', handleActorDragMove);
      window.removeEventListener('touchmove', handleActorDragMove);
      window.removeEventListener('mouseup', handleActorDragEnd);
      window.removeEventListener('touchend', handleActorDragEnd);

      renderKeyframeTimeline();
    }

    function selectActor(id) {
      state.selectedActorId = id;
      state.selectedActorIds.add(id);
      const currentFrame = state.frames[state.currentFrameIndex];
      const actor = currentFrame ? currentFrame.actors.find(a => a.id === id) : null;

      if (actor && actor.type === 'player') {
        inspectorPanel.classList.remove('hidden');
        inspectorPanel.classList.add('flex');
        inspectorLabel.value = actor.num;
        inspectorName.value = actor.name;
        btnAttachBall.innerHTML = actor.carrier 
          ? `<i data-lucide="check" class="w-3 h-3 text-emerald-400"></i> Ball Carrier` 
          : `<i data-lucide="paperclip" class="w-3 h-3"></i> Make Carrier`;
        lucide.createIcons();
      } else {
        inspectorPanel.classList.add('hidden');
        inspectorPanel.classList.remove('flex');
      }
      renderActors();
    }

    function removePlayerById(id) {
      const currentFrame = state.frames[state.currentFrameIndex];
      if (!currentFrame) return;

      currentFrame.actors = currentFrame.actors.filter(a => a.id !== id);
      state.selectedActorIds.delete(id);
      if (state.selectedActorId === id) {
        state.selectedActorId = null;
        inspectorPanel.classList.add('hidden');
      }
      renderActors();
      renderRosterList();
      renderGhostTrails();
      renderKeyframeTimeline();
    }

    // Pitch Canvas Click & Area Marquee Selection
    pitchSvg.onmousedown = handleDrawOrMarqueeStart;
    pitchSvg.ontouchstart = handleDrawOrMarqueeStart;

    function handleDrawOrMarqueeStart(e) {
      if (state.isPlaying) return;

      // Select Tool: background click clears selection or starts marquee drag box
      if (state.currentTool === 'select') {
        if (!e.shiftKey) {
          state.selectedActorIds.clear();
          state.selectedActorId = null;
          inspectorPanel.classList.add('hidden');
          renderActors();
        }

        // Start marquee area selection
        isMarqueeSelecting = true;
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        marqueeStartClient = { x: clientX, y: clientY };

        const wrapperRect = pitchWrapper.getBoundingClientRect();
        selectionBox.style.left = `${clientX - wrapperRect.left}px`;
        selectionBox.style.top = `${clientY - wrapperRect.top}px`;
        selectionBox.style.width = '0px';
        selectionBox.style.height = '0px';
        selectionBox.style.display = 'block';

        window.addEventListener('mousemove', handleMarqueeMove);
        window.addEventListener('touchmove', handleMarqueeMove, { passive: false });
        window.addEventListener('mouseup', handleMarqueeEnd);
        window.addEventListener('touchend', handleMarqueeEnd);
        return;
      }

      // Drawing Tools
      isDrawing = true;
      drawingStartPt = getPitchCoords(e);
      currentFreehandPoints = [drawingStartPt];

      window.addEventListener('mousemove', handleDrawMove);
      window.addEventListener('touchmove', handleDrawMove, { passive: false });
      window.addEventListener('mouseup', handleDrawEnd);
      window.addEventListener('touchend', handleDrawEnd);
    }

    function handleMarqueeMove(e) {
      if (!isMarqueeSelecting) return;
      if (e.cancelable && e.type === 'touchmove') e.preventDefault();

      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      const wrapperRect = pitchWrapper.getBoundingClientRect();

      const left = Math.min(clientX, marqueeStartClient.x) - wrapperRect.left;
      const top = Math.min(clientY, marqueeStartClient.y) - wrapperRect.top;
      const width = Math.abs(clientX - marqueeStartClient.x);
      const height = Math.abs(clientY - marqueeStartClient.y);

      selectionBox.style.left = `${left}px`;
      selectionBox.style.top = `${top}px`;
      selectionBox.style.width = `${width}px`;
      selectionBox.style.height = `${height}px`;
    }

    function handleMarqueeEnd(e) {
      if (!isMarqueeSelecting) return;
      isMarqueeSelecting = false;
      selectionBox.style.display = 'none';

      window.removeEventListener('mousemove', handleMarqueeMove);
      window.removeEventListener('touchmove', handleMarqueeMove);
      window.removeEventListener('mouseup', handleMarqueeEnd);
      window.removeEventListener('touchend', handleMarqueeEnd);

      const clientX = e.changedTouches ? e.changedTouches[0].clientX : e.clientX;
      const clientY = e.changedTouches ? e.changedTouches[0].clientY : e.clientY;

      const minX = Math.min(clientX, marqueeStartClient.x);
      const maxX = Math.max(clientX, marqueeStartClient.x);
      const minY = Math.min(clientY, marqueeStartClient.y);
      const maxY = Math.max(clientY, marqueeStartClient.y);

      // Only perform area selection if drag box is larger than 6px
      if (maxX - minX > 6 || maxY - minY > 6) {
        const currentFrame = state.frames[state.currentFrameIndex];
        const pitchRect = pitchSvg.getBoundingClientRect();

        currentFrame.actors.forEach(actor => {
          const coords = pitchToPercent(actor.x, actor.y);
          const screenX = pitchRect.left + (coords.pX / 100) * pitchRect.width;
          const screenY = pitchRect.top + (coords.pY / 100) * pitchRect.height;

          if (screenX >= minX && screenX <= maxX && screenY >= minY && screenY <= maxY) {
            state.selectedActorIds.add(actor.id);
            state.selectedActorId = actor.id;
          }
        });

        renderActors();
        if (state.selectedActorIds.size > 0) {
          showToast(`${state.selectedActorIds.size} players selected`);
        }
      }
    }

    // Tactical Drawing Engine
    function handleDrawMove(e) {
      if (!isDrawing || !drawingStartPt) return;
      const pt = getPitchCoords(e);

      if (state.currentTool === 'run' || state.currentTool === 'pass' || state.currentTool === 'tackle') {
        activeDrawingPath.setAttribute('d', `M ${drawingStartPt.x} ${drawingStartPt.y} L ${pt.x} ${pt.y}`);
        activeDrawingPath.setAttribute('stroke', state.currentColor);
        activeDrawingPath.setAttribute('stroke-dasharray', state.currentTool === 'pass' ? '8 6' : 'none');
      } else if (state.currentTool === 'kick') {
        const midX = (drawingStartPt.x + pt.x) / 2;
        const midY = Math.min(drawingStartPt.y, pt.y) - 60;
        activeDrawingPath.setAttribute('d', `M ${drawingStartPt.x} ${drawingStartPt.y} Q ${midX} ${midY} ${pt.x} ${pt.y}`);
        activeDrawingPath.setAttribute('stroke', state.currentColor);
        activeDrawingPath.setAttribute('stroke-dasharray', '4 4');
      }
    }

    function handleDrawEnd(e) {
      if (!isDrawing) return;
      isDrawing = false;
      const endPt = getPitchCoords(e);

      const currentFrame = state.frames[state.currentFrameIndex];
      if (drawingStartPt && (Math.hypot(endPt.x - drawingStartPt.x, endPt.y - drawingStartPt.y) > 15)) {
        currentFrame.drawings.push({
          tool: state.currentTool,
          color: state.currentColor,
          start: drawingStartPt,
          end: endPt
        });
      }

      activeDrawingPath.setAttribute('d', '');
      drawingStartPt = null;

      window.removeEventListener('mousemove', handleDrawMove);
      window.removeEventListener('touchmove', handleDrawMove);
      window.removeEventListener('mouseup', handleDrawEnd);
      window.removeEventListener('touchend', handleDrawEnd);

      renderDrawings();
    }

    function renderDrawings() {
      drawingsLayer.innerHTML = '';
      const currentFrame = state.frames[state.currentFrameIndex];
      if (!currentFrame || !currentFrame.drawings) return;

      currentFrame.drawings.forEach(d => {
        const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
        path.setAttribute('stroke', d.color);
        path.setAttribute('stroke-width', '3');
        path.setAttribute('fill', 'none');
        path.setAttribute('stroke-linecap', 'round');

        if (d.tool === 'run') {
          path.setAttribute('d', `M ${d.start.x} ${d.start.y} L ${d.end.x} ${d.end.y}`);
          path.setAttribute('marker-end', 'url(#arrow-run)');
        } else if (d.tool === 'pass') {
          path.setAttribute('d', `M ${d.start.x} ${d.start.y} L ${d.end.x} ${d.end.y}`);
          path.setAttribute('stroke-dasharray', '8 6');
          path.setAttribute('marker-end', 'url(#arrow-pass)');
        } else if (d.tool === 'kick') {
          const midX = (d.start.x + d.end.x) / 2;
          const midY = Math.min(d.start.y, d.end.y) - 60;
          path.setAttribute('d', `M ${d.start.x} ${d.start.y} Q ${midX} ${midY} ${d.end.x} ${d.end.y}`);
          path.setAttribute('stroke-dasharray', '4 4');
          path.setAttribute('marker-end', 'url(#arrow-kick)');
        } else if (d.tool === 'tackle') {
          path.setAttribute('d', `M ${d.start.x} ${d.start.y} L ${d.end.x} ${d.end.y}`);
          path.setAttribute('stroke', '#ef4444');
          path.setAttribute('stroke-width', '4');
        }

        drawingsLayer.appendChild(path);
      });
    }

    // Ghost Motion Trails (Between Steps)
    function renderGhostTrails() {
      ghostTrailsLayer.innerHTML = '';
      if (!state.showGhostTrails || state.frames.length <= 1) return;

      const currentIdx = state.currentFrameIndex;
      if (currentIdx === 0) return;

      const prevFrame = state.frames[currentIdx - 1];
      const currFrame = state.frames[currentIdx];

      currFrame.actors.forEach(curr => {
        const prev = prevFrame.actors.find(a => a.id === curr.id);
        if (!prev) return;

        const dist = Math.hypot(curr.x - prev.x, curr.y - prev.y);
        if (dist > 15) {
          const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
          path.setAttribute('d', `M ${prev.x} ${prev.y} L ${curr.x} ${curr.y}`);
          path.setAttribute('stroke', curr.team === 'A' ? '#ef4444' : '#f59e0b');
          path.setAttribute('stroke-width', '2');
          path.setAttribute('stroke-dasharray', '4 4');
          path.setAttribute('fill', 'none');
          ghostTrailsLayer.appendChild(path);

          const dot = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
          dot.setAttribute('cx', prev.x);
          dot.setAttribute('cy', prev.y);
          dot.setAttribute('r', '4');
          dot.setAttribute('fill', curr.team === 'A' ? '#ef4444' : '#f59e0b');
          dot.setAttribute('opacity', '0.5');
          ghostTrailsLayer.appendChild(dot);
        }
      });
    }

    };

    // Keyframe Animation & Timeline System
    function renderKeyframeTimeline() {
      keyframeTimelineTrack.innerHTML = '';

      state.frames.forEach((frame, idx) => {
        const isCurrent = idx === state.currentFrameIndex;
        const card = document.createElement('div');
        card.className = `relative flex-shrink-0 w-28 h-20 rounded-xl p-2 cursor-pointer border-2 transition-all flex flex-col justify-between ${
          isCurrent 
            ? 'bg-slate-800 border-red-500 shadow-lg shadow-red-950/60 active-frame-card' 
            : 'bg-slate-900 border-slate-700/80 hover:border-slate-500 text-slate-400'
        }`;

        card.innerHTML = `
          <div class="flex items-center justify-between">
            <span class="text-[10px] font-black uppercase tracking-wider ${isCurrent ? 'text-red-400' : 'text-slate-400'}">
              Phase ${idx + 1}
            </span>
            ${state.frames.length > 1 ? `
              <button class="delete-frame-btn text-slate-500 hover:text-red-400 text-xs px-1 font-bold" title="Delete Phase">✕</button>
            ` : ''}
          </div>
          <div class="text-[10px] text-slate-400 truncate font-medium">
            ${frame.name || `Step ${idx + 1}`}
          </div>
          <div class="text-[9px] text-slate-500 flex items-center justify-between">
            <span>${frame.actors.filter(a => a.type === 'player').length} players</span>
            <span>${frame.drawings ? frame.drawings.length : 0} lines</span>
          </div>
        `;

        card.onclick = (e) => {
          if (e.target.closest('.delete-frame-btn')) {
            e.stopPropagation();
            deleteFrame(idx);
            return;
          }
          jumpToFrame(idx);
        };

        keyframeTimelineTrack.appendChild(card);
      });

      frameStatusText.innerText = `Phase ${state.currentFrameIndex + 1} of ${state.frames.length}`;
    }

    function jumpToFrame(index) {
      if (index < 0 || index >= state.frames.length) return;
      pauseAnimation();
      state.currentFrameIndex = index;
      renderActors();
      renderDrawings();
      renderGhostTrails();
      renderKeyframeTimeline();
      renderRosterList();
    }

    function addFrame() {
      pauseAnimation();
      const current = state.frames[state.currentFrameIndex];
      const clonedActors = JSON.parse(JSON.stringify(current.actors));

      const newFrame = {
        id: Date.now(),
        name: `Phase ${state.frames.length + 1}`,
        actors: clonedActors,
        drawings: []
      };

      state.frames.splice(state.currentFrameIndex + 1, 0, newFrame);
      state.currentFrameIndex++;
      jumpToFrame(state.currentFrameIndex);
      showToast(`Added Phase ${state.currentFrameIndex + 1}`);
    }

    function duplicateFrame() {
      pauseAnimation();
      const current = state.frames[state.currentFrameIndex];
      const cloned = JSON.parse(JSON.stringify(current));
      cloned.id = Date.now();
      cloned.name = `${current.name} (Copy)`;

      state.frames.splice(state.currentFrameIndex + 1, 0, cloned);
      state.currentFrameIndex++;
      jumpToFrame(state.currentFrameIndex);
      showToast(`Duplicated Phase`);
    }

    function deleteFrame(idx) {
      if (state.frames.length <= 1) return;
      pauseAnimation();
      state.frames.splice(idx, 1);
      state.currentFrameIndex = Math.min(state.currentFrameIndex, state.frames.length - 1);
      jumpToFrame(state.currentFrameIndex);
    }

    document.getElementById('btnAddFrame').onclick = addFrame;
    document.getElementById('btnDuplicateFrame').onclick = duplicateFrame;
    document.getElementById('btnPrevFrame').onclick = () => jumpToFrame(state.currentFrameIndex - 1);
    document.getElementById('btnNextFrame').onclick = () => jumpToFrame(state.currentFrameIndex + 1);

    // Smooth Keyframe Animation Player
    function togglePlay() {
      if (state.isPlaying) {
        pauseAnimation();
      } else {
        startAnimation();
      }
    }

    function startAnimation() {
      if (state.frames.length <= 1) {
        showToast("Add at least 2 phases to animate!");
        return;
      }
      state.isPlaying = true;
      playIcon.setAttribute('data-lucide', 'pause');
      btnPlayPause.classList.replace('bg-red-600', 'bg-amber-500');
      lucide.createIcons();

      state.lastTimestamp = performance.now();
      state.animFrameReq = requestAnimationFrame(animationLoop);
    }

    function pauseAnimation() {
      state.isPlaying = false;
      if (state.animFrameReq) {
        cancelAnimationFrame(state.animFrameReq);
        state.animFrameReq = null;
      }
      playIcon.setAttribute('data-lucide', 'play');
      btnPlayPause.classList.replace('bg-amber-500', 'bg-red-600');
      lucide.createIcons();
      renderActors();
    }

    btnPlayPause.onclick = togglePlay;

    function animationLoop(timestamp) {
      if (!state.isPlaying) return;

      const delta = timestamp - state.lastTimestamp;
      state.lastTimestamp = timestamp;

      const effectiveDuration = state.frameDurationMs / state.playbackSpeed;
      state.animationProgress += delta / effectiveDuration;

      if (state.animationProgress >= 1) {
        state.animationProgress = 0;
        state.currentFrameIndex++;

        if (state.currentFrameIndex >= state.frames.length - 1) {
          if (state.loop) {
            state.currentFrameIndex = 0;
          } else {
            state.currentFrameIndex = state.frames.length - 1;
            pauseAnimation();
            return;
          }
        }
        renderKeyframeTimeline();
      }

      // Interpolate positions between current and next phase
      const frameA = state.frames[state.currentFrameIndex];
      const nextIdx = (state.currentFrameIndex + 1) % state.frames.length;
      const frameB = state.frames[nextIdx];

      const t = easeInOutQuad(state.animationProgress);
      const interpolatedActors = interpolateFrameActors(frameA.actors, frameB.actors, t);

      renderActors(interpolatedActors);
      state.animFrameReq = requestAnimationFrame(animationLoop);
    }

    function easeInOutQuad(t) {
      return t < 0.5 ? 2 * t * t : -1 + (4 - 2 * t) * t;
    }

    function interpolateFrameActors(actorsA, actorsB, t) {
      const mapB = new Map(actorsB.map(a => [a.id, a]));
      return actorsA.map(a => {
        const target = mapB.get(a.id);
        if (!target) return a;
        return {
          ...a,
          x: a.x + (target.x - a.x) * t,
          y: a.y + (target.y - a.y) * t
        };
      });
    }

    document.getElementById('playbackSpeed').onchange = (e) => {
      state.playbackSpeed = parseFloat(e.target.value);
    };

    document.getElementById('btnToggleLoop').onclick = () => {
      state.loop = !state.loop;
      document.getElementById('btnToggleLoop').classList.toggle('text-emerald-300', state.loop);
      document.getElementById('btnToggleLoop').classList.toggle('text-slate-500', !state.loop);
      showToast(state.loop ? "Looping enabled" : "Looping disabled");
    };

    // Annotation Tools & Swatches
    function setActiveTool(tool) {
      state.currentTool = tool;
      const toolButtons = [
        { id: 'toolSelect', name: 'select' },
        { id: 'toolRun', name: 'run' },
        { id: 'toolPass', name: 'pass' },
        { id: 'toolKick', name: 'kick' },
        { id: 'toolTackle', name: 'tackle' }
      ];

      toolButtons.forEach(b => {
        const el = document.getElementById(b.id);
        if (b.name === tool) {
          el.className = 'p-1.5 rounded-lg bg-red-600 text-white font-semibold flex items-center gap-1 text-xs transition';
        } else {
          el.className = 'p-1.5 rounded-lg text-slate-400 hover:text-white hover:bg-slate-800 transition';
        }
      });
    }

    document.getElementById('toolSelect').onclick = () => setActiveTool('select');
    document.getElementById('toolRun').onclick = () => setActiveTool('run');
    document.getElementById('toolPass').onclick = () => setActiveTool('pass');
    document.getElementById('toolKick').onclick = () => setActiveTool('kick');
    document.getElementById('toolTackle').onclick = () => setActiveTool('tackle');

    document.querySelectorAll('.color-swatch').forEach(btn => {
      btn.onclick = () => {
        document.querySelectorAll('.color-swatch').forEach(s => s.classList.replace('ring-2', 'ring-1'));
        btn.classList.replace('ring-1', 'ring-2');
        state.currentColor = btn.dataset.color;
      };
    });

    document.getElementById('btnClearDrawings').onclick = () => {
      const current = state.frames[state.currentFrameIndex];
      if (current) current.drawings = [];
      renderDrawings();
      renderKeyframeTimeline();
    };

    document.getElementById('btnClearPitch').onclick = () => {
      if (confirm("Clear all players and tactical drawings from this phase?")) {
        const current = state.frames[state.currentFrameIndex];
        current.actors = [];
        current.drawings = [];
        state.selectedActorIds.clear();
        state.selectedActorId = null;
        renderActors();
        renderDrawings();
        renderRosterList();
        renderGhostTrails();
        renderKeyframeTimeline();
      }
    };

    // Local Storage & GitHub Manifest Playbook Loading
    function savePlayToLocalPresets() {
      const currentTitle = document.getElementById('playTitleDisplay').innerText.trim() || 'My Play';
      const playName = prompt("Enter a name for this custom preset:", currentTitle);
      if (!playName) return;

      const customPlay = {
        title: playName,
        frames: state.frames,
        timestamp: Date.now()
      };

      try {
        const saved = JSON.parse(localStorage.getItem('rugby_custom_plays') || '[]');
        const existingIdx = saved.findIndex(p => p.title.toLowerCase() === playName.toLowerCase());
        if (existingIdx >= 0) {
          saved[existingIdx] = customPlay;
        } else {
          saved.push(customPlay);
        }
        localStorage.setItem('rugby_custom_plays', JSON.stringify(saved));
        populateLocalPresetsDropdown();
        showToast(`Saved "${playName}" to device presets!`);
      } catch (err) {
        showToast("Storage error: Unable to save locally.");
      }
    }

    function populateLocalPresetsDropdown() {
      const grp = document.getElementById('localCustomGroup');
      const grpMobile = document.getElementById('localCustomGroupMobile');
      grp.innerHTML = '';
      grpMobile.innerHTML = '';

      try {
        const saved = JSON.parse(localStorage.getItem('rugby_custom_plays') || '[]');
        if (saved.length > 0) {
          grp.classList.remove('hidden');
          grpMobile.classList.remove('hidden');

          saved.forEach((p, idx) => {
            const opt = document.createElement('option');
            opt.value = `local_${idx}`;
            opt.innerText = p.title;
            grp.appendChild(opt);

            const optMob = opt.cloneNode(true);
            grpMobile.appendChild(optMob);
          });
        } else {
          grp.classList.add('hidden');
          grpMobile.classList.add('hidden');
        }
      } catch (e) {
        grp.classList.add('hidden');
        grpMobile.classList.add('hidden');
      }
    }

    async function loadTeamManifestPlays() {
      const grp = document.getElementById('githubPlaysGroup');
      const grpMobile = document.getElementById('githubPlaysGroupMobile');
      grp.innerHTML = '';
      grpMobile.innerHTML = '';

      try {
        // Attempt to fetch manifest from plays folder
        const res = await fetch('plays/manifest.json');
        if (!res.ok) throw new Error('No plays manifest found');
        const plays = await res.json();
        state.githubManifestPlays = plays;

        if (Array.isArray(plays) && plays.length > 0) {
          grp.classList.remove('hidden');
          grpMobile.classList.remove('hidden');

          plays.forEach((p, idx) => {
            const opt = document.createElement('option');
            opt.value = `gh_${idx}`;
            opt.innerText = p.title;
            grp.appendChild(opt);

            const optMob = opt.cloneNode(true);
            grpMobile.appendChild(optMob);
          });
          showToast(`Loaded ${plays.length} team plays from GitHub`);
        }
      } catch (e) {
        grp.classList.add('hidden');
        grpMobile.classList.add('hidden');
      }
    }

    async function handlePresetChange(val) {
      if (!val) return;

      if (val.startsWith('local_')) {
        const idx = parseInt(val.replace('local_', ''), 10);
        const saved = JSON.parse(localStorage.getItem('rugby_custom_plays') || '[]');
        const play = saved[idx];
        if (play) loadPlayData(play);
      } else if (val.startsWith('gh_')) {
        const idx = parseInt(val.replace('gh_', ''), 10);
        const item = state.githubManifestPlays[idx];
        if (item && item.file) {
          try {
            showToast(`Loading "${item.title}"...`);
            const res = await fetch(item.file);
            const play = await res.json();
            play.title = item.title;
            loadPlayData(play);
          } catch (err) {
            alert(`Could not load play file: ${item.file}`);
          }
        }
      }
    }

    function loadPlayData(play) {
      pauseAnimation();
      state.frames = JSON.parse(JSON.stringify(play.frames || [play]));
      state.currentFrameIndex = 0;
      document.getElementById('playTitleDisplay').innerText = play.title || 'Loaded Play';
      jumpToFrame(0);
      showToast(`Loaded Play: ${play.title || 'Custom Play'}`);
    }

    document.getElementById('presetSelect').onchange = (e) => handlePresetChange(e.target.value);
    document.getElementById('presetSelectMobile').onchange = (e) => handlePresetChange(e.target.value);
    document.getElementById('btnSyncManifest').onclick = loadTeamManifestPlays;
    document.getElementById('btnSyncManifestMobile').onclick = loadTeamManifestPlays;
    document.getElementById('btnSaveToLocal').onclick = savePlayToLocalPresets;
    document.getElementById('btnSaveToLocalMobile').onclick = savePlayToLocalPresets;

    // Save JSON Export
    document.getElementById('btnExportJSON').onclick = () => {
      const data = {
        title: document.getElementById('playTitleDisplay').innerText.trim() || 'U13 Play',
        timestamp: Date.now(),
        frames: state.frames
      };

      const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `u13-play-${Date.now().toString().slice(-4)}.json`;
      a.click();
      URL.revokeObjectURL(url);
      showToast("Playbook JSON exported successfully");
    };

    // Load JSON Modal Logic
    const loadModal = document.getElementById('loadModal');
    const fileInput = document.getElementById('fileInput');
    const dropZone = document.getElementById('dropZone');

    document.getElementById('btnOpenLoadModal').onclick = () => loadModal.classList.remove('hidden');
    document.getElementById('btnCloseLoadModal').onclick = () => loadModal.classList.add('hidden');
    document.getElementById('btnCancelLoad').onclick = () => loadModal.classList.add('hidden');

    dropZone.onclick = () => fileInput.click();

    fileInput.onchange = (e) => {
      const file = e.target.files[0];
      if (file) parseAndLoadFile(file);
    };

    dropZone.ondragover = (e) => {
      e.preventDefault();
      dropZone.classList.add('border-emerald-500');
    };
    dropZone.ondragleave = () => dropZone.classList.remove('border-emerald-500');
    dropZone.ondrop = (e) => {
      e.preventDefault();
      dropZone.classList.remove('border-emerald-500');
      const file = e.dataTransfer.files[0];
      if (file) parseAndLoadFile(file);
    };

    document.getElementById('btnConfirmLoad').onclick = () => {
      const text = document.getElementById('rawJsonInput').value.trim();
      if (!text) return;
      try {
        const parsed = JSON.parse(text);
        loadPlayData(parsed);
        loadModal.classList.add('hidden');
        document.getElementById('rawJsonInput').value = '';
      } catch (err) {
        alert("Invalid JSON format. Please check the code.");
      }
    };

    function parseAndLoadFile(file) {
      const reader = new FileReader();
      reader.onload = (e) => {
        try {
          const parsed = JSON.parse(e.target.result);
          loadPlayData(parsed);
          loadModal.classList.add('hidden');
        } catch (err) {
          alert("Invalid playbook file.");
        }
      };
      reader.readAsText(file);
    }

    // Export PNG Snapshot
    document.getElementById('btnExportImage').onclick = () => {
      const svgString = new XMLSerializer().serializeToString(pitchSvg);
      const svgBlob = new Blob([svgString], { type: 'image/svg+xml;charset=utf-8' });
      const URLObj = window.URL || window.webkitURL || window;
      const blobURL = URLObj.createObjectURL(svgBlob);

      const image = new Image();
      image.onload = () => {
        const canvas = document.createElement('canvas');
        canvas.width = 1200;
        canvas.height = 720;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#064e3b';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.drawImage(image, 0, 0, canvas.width, canvas.height);

        const png = canvas.toDataURL('image/png');
        const a = document.createElement('a');
        a.download = `tactics-phase-${state.currentFrameIndex + 1}.png`;
        a.href = png;
        a.click();
        URLObj.revokeObjectURL(blobURL);
        showToast("Exported PNG snapshot");
      };
      image.src = blobURL;
    };

    // Keyboard Shortcuts
    window.addEventListener('keydown', (e) => {
      if (['INPUT', 'SELECT', 'TEXTAREA'].includes(e.target.tagName)) return;

      if (e.code === 'Space') {
        e.preventDefault();
        togglePlay();
      } else if (e.code === 'ArrowRight') {
        e.preventDefault();
        if (state.currentFrameIndex < state.frames.length - 1) jumpToFrame(state.currentFrameIndex + 1);
      } else if (e.code === 'ArrowLeft') {
        e.preventDefault();
        if (state.currentFrameIndex > 0) jumpToFrame(state.currentFrameIndex - 1);
      } else if (e.code === 'KeyV') {
        setActiveTool('select');
      } else if (e.code === 'KeyR') {
        setActiveTool('run');
      } else if (e.code === 'KeyP') {
        setActiveTool('pass');
      } else if (e.code === 'KeyK') {
        setActiveTool('kick');
      } else if (e.code === 'KeyT') {
        setActiveTool('tackle');
      } else if (e.code === 'Delete' || e.code === 'Backspace') {
        if (state.selectedActorIds.size > 0) {
          const ids = Array.from(state.selectedActorIds);
          ids.forEach(id => removePlayerById(id));
          state.selectedActorIds.clear();
        } else if (state.selectedActorId) {
          removePlayerById(state.selectedActorId);
        }
      }
    });

    function showToast(msg) {
      toastMsg.innerText = msg;
      toast.classList.remove('opacity-0', 'translate-y-20', 'pointer-events-none');
      toast.classList.add('opacity-100', 'translate-y-0');
      clearTimeout(toast._timer);
      toast._timer = setTimeout(() => {
        toast.classList.add('opacity-0', 'translate-y-20', 'pointer-events-none');
        toast.classList.remove('opacity-100', 'translate-y-0');
      }, 2400);
    }

    // Application Initialization
    window.onload = () => {
      lucide.createIcons();
      renderRosterList();
      deployFormationPreset('freepass');
      populateLocalPresetsDropdown();
      loadTeamManifestPlays();
    };
  </script>
</body>
</html>
